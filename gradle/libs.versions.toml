[versions]
# --- Build toolchain ---
# AGP 9.3.x brings its own Kotlin (2.2.10), but the Compose compiler plugin below pulls the
# Kotlin Gradle plugin up to the version pinned here — so `kotlin` is what actually compiles the
# app. Keep the Compose compiler plugin on this exact version. Verified 2026-08-27.
agp = "9.3.2"
kotlin = "2.4.10"

# --- AndroidX / Jetpack ---
coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
tvMaterial = "1.1.0"
tvProvider = "1.1.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.0"
datastore = "1.2.1"
work = "2.11.2"

# --- Build tooling ---
# KSP2 (decoupled versioning). Used by Room. Verified 2026-08-27.
# 2.3.10 fixed R-class resolution when AGP 9's built-in Kotlin is active (KSP #2857).
# There is no 2.4.x line yet; 2.3.11 compiles fine against the Kotlin pinned above — KSP2's
# versioning is decoupled from the compiler's, so the mismatch in the number is expected.
ksp = "2.3.11"

# --- Database / paging ---
room = "2.8.4"
paging = "3.5.1"

# --- Media playback ---
# Bumped to 1.11.0: AudioTrack init + HLS live timestamp/refresh fixes, TTML timing, MPEG-TS DTS-HD.
# Two defaults changed here: playback now uses dynamic scheduling instead of a fixed interval, and
# the default PCM buffer is a fixed 500ms — both are felt by the forced-stereo DefaultAudioSink path.
media3 = "1.11.0"
# libmpv (FFmpeg-based) — full codec/track support for IPTV, caching, speed, etc.
libmpv = "1.0.0"

# Installs the APK's merged baseline profiles (Compose/Media3/library-shipped) into ART at
# install/boot time. Essential for a sideloaded app: without it, baseline profiles only ever
# reach devices through Play cloud profiles, which OwnTV doesn't have.
profileinstaller = "1.4.1"

# Compat splash screen (audit ST3). Backports the API 31 splash contract to API 26 so the cold
# start shows the OwnTV play-mark instead of a blank window while the profile row loads.
splashscreen = "1.2.0"

# Macrobenchmark + the baseline-profile Gradle plugin (audit ST1). The plugin and the runtime
# library are versioned together — bump both or neither. Must be 1.5.0-alpha+: the 1.4.x plugin
# rejects an AGP 9 app module outright ("Module `:app` is not a supported android module").
benchmark = "1.5.0-rc02"
uiautomator = "2.4.0"

# --- Kotlin libs ---
coroutines = "1.11.0"

# --- Third party ---
coil = "3.6.0"
koin = "4.2.2"
# OkHttp 5 is a KMP module: Android consumers resolve to `okhttp-android`, which carries the
# Android platform support (TLS socket adapter, cert chain cleaner) and consumer R8 rules.
# Brings Happy Eyeballs (fastFallback) on by default — parallel IPv4/IPv6 connect.
okhttp = "5.5.0"
youtubePlayer = "13.0.0"
# QR generation for the Remote (companion) add-source flow — pure-Java, offline, no Android deps.
zxing = "3.5.4"
# Charset detection for local subtitle files (subtitle plan §7.2 / review R6) — tiny, pure-Java
# Mozilla universalchardet port; local .srt files are frequently Windows-125x, not UTF-8.
juniversalchardet = "2.5.0"

# --- Test ---
junit = "4.13.2"
# Test-only: the real org.json, so JVM unit tests can exercise code built on JSONObject/JSONArray
# (the android.jar stub returns defaults for every method under isReturnDefaultValues).
orgJson = "20260814"
junitExt = "1.3.0"
espressoCore = "3.7.0"

# --- OwnTV core library (https://github.com/ahXN00/OwnTV_Core) ---
# Both artifacts always ship on the same version; never split them. Bumping this is how the TV app
# takes a core change. For local work, owntv.corePath in ~/.gradle/gradle.properties substitutes
# core's source for these artifacts, and this number is then ignored.
owntvCore = "1.0.22"

[libraries]
# The shared engine, from its own repository
owntv-core = { group = "tv.own.owntv", name = "core", version.ref = "owntvCore" }
owntv-player-core = { group = "tv.own.owntv", name = "player-core", version.ref = "owntvCore" }

# Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose (versions managed by the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# Runtime only (state, remember, effects) — no ui/foundation. This is the one Compose artifact
# :core is allowed to depend on; it carries no screen-shape assumptions, so it stays usable from
# the mobile app as well as the TV one.
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# Compose for TV
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
androidx-tvprovider = { group = "androidx.tvprovider", name = "tvprovider", version.ref = "tvProvider" }

# Lifecycle / Navigation
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# DataStore (theme / prefs persistence)
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager (durable background sync)
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Room (database) + Paging
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# Baseline profile installer (AOT-compiles hot paths from bundled profiles on sideloaded installs)
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Image loading
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# QR code generation (Remote companion add-source) — encodes the LAN URL into a scannable bitmap.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

# Charset detection for local subtitle files (subtitle plan §7.2 / review R6).
juniversalchardet = { group = "com.github.albfernandez", name = "juniversalchardet", version.ref = "juniversalchardet" }

# Networking (M3U/Xtream fetch)
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# In-app YouTube trailer playback (WebView IFrame wrapper) — plan §7.3; ToS-clean, exposes currentSecond/duration
youtube-player = { group = "com.pierfrancescosoffritti.androidyoutubeplayer", name = "core", version.ref = "youtubePlayer" }

# Media3 / ExoPlayer
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

# libmpv player engine
libmpv = { group = "dev.jdtech.mpv", name = "libmpv", version.ref = "libmpv" }

# Dependency injection
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# :core and :player-core are Android libraries, not applications. Same AGP version as the app.
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# KSP 2.3.6+ supports AGP 9's built-in Kotlin.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Baseline profiles (audit ST1): the test module records the journey, the app module consumes the
# generated profile and packages it as baseline.prof.
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
