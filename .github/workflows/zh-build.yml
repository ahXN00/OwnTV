name: 汉化版本编译

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "release"
        type: choice
        options:
        - debug
        - release
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_MIN_SDK: '26'
  ANDROID_TARGET_SDK: '36'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Git中文标识
        run: |
          git config --local user.email "chinese-build@github.com"
          git config --local user.name "中文编译机器人"

      - name: 设置Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 设置Android SDK
        uses: android-actions/setup-android@v3

      - name: 设置Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 设置构建版本号
        id: version
        run: |
          # 生成版本号: 使用提交哈希和时间戳
          TIMESTAMP=$(date +'%Y%m%d.%H%M')
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          VERSION_NAME="zh-$TIMESTAMP-$COMMIT_SHORT"
          VERSION_CODE=$(date +'%Y%m%d')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "版本: $VERSION_NAME (代码: $VERSION_CODE)"

      - name: 授予gradlew执行权限
        run: chmod +x ./gradlew

      - name: 清理Gradle缓存
        run: ./gradlew clean

      - name: 构建Debug APK
        if: github.event_name == 'pull_request' || github.event.inputs.build_type == 'debug'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          echo "构建调试版本: VERSION_NAME=$VERSION_NAME, VERSION_CODE=$VERSION_CODE"
          ./gradlew assembleDebug --stacktrace --no-daemon
          # 重命名APK文件
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          cp "$DEBUG_APK" "OwnTV-zh-debug-${{ steps.version.outputs.version_name }}.apk"
          echo "DEBUG_APK_PATH=OwnTV-zh-debug-${{ steps.version.outputs.version_name }}.apk" >> $GITHUB_ENV

      - name: 构建Release APK
        if: github.event_name != 'pull_request' && (github.event.inputs.build_type == 'release' || github.event_name == 'push')
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          echo "构建发布版本: VERSION_NAME=$VERSION_NAME, VERSION_CODE=$VERSION_CODE"
          ./gradlew assembleRelease --stacktrace --no-daemon
          # 重命名APK文件
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$RELEASE_APK" "OwnTV-zh-release-${{ steps.version.outputs.version_name }}.apk"
          echo "RELEASE_APK_PATH=OwnTV-zh-release-${{ steps.version.outputs.version_name }}.apk" >> $GITHUB_ENV

      - name: 创建汉化说明文件
        run: |
          cat > 汉化说明.md << 'EOF'
          # OwnTV 汉化版本

          ## 构建信息
          - **构建时间**: $(date +'%Y-%m-%d %H:%M:%S')
          - **构建版本**: ${{ steps.version.outputs.version_name }}
          - **Git提交**: ${{ github.sha }}
          - **分支**: ${{ github.ref_name }}

          ## 汉化内容
          此版本包含了完整的中文界面汉化，包括：

          1. **导航菜单** - 搜索、首页、直播、电影、剧集、下载、节目指南、设置
          2. **设置界面** - 用户档案、播放列表、节目指南源、主题、备份、视频播放器、个性化等
          3. **按钮和开关** - 直播预览、预览声音、自动播放、启动检查更新等
          4. **对话框和提示** - 退出确认、缩放警告、回看时间设置等
          5. **侧边栏和主页** - 用户信息、切换用户、继续观看系列等文本

          ## 安装说明
          1. 下载APK文件
          2. 在Android TV或设备上安装
          3. 确保已开启"未知来源"安装权限
          4. 安装后即可享受中文界面

          ## 注意事项
          - 此版本为汉化编译版，功能与原版相同
          - 技术术语如HDR、PIN、M3U等保持英文原样
          - 如遇问题，请检查设备兼容性

          ## 编译来源
          - 项目: https://github.com/AvalonO98/OwnTV
          - 汉化版本: 基于最新主分支
          EOF

      - name: 打包构建产物
        run: |
          mkdir -p artifacts
          # 移动APK文件
          if [ -n "$DEBUG_APK_PATH" ] && [ -f "$DEBUG_APK_PATH" ]; then
            mv "$DEBUG_APK_PATH" artifacts/
          fi
          if [ -n "$RELEASE_APK_PATH" ] && [ -f "$RELEASE_APK_PATH" ]; then
            mv "$RELEASE_APK_PATH" artifacts/
          fi
          # 移动说明文件
          mv 汉化说明.md artifacts/
          # 生成文件清单
          ls -la artifacts/ > artifacts/文件清单.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 汉化版本构建
          path: artifacts/*
          retention-days: 30

      - name: 创建GitHub Release (仅主分支推送)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: "OwnTV 汉化版本 ${{ steps.version.outputs.version_name }}"
          tag_name: "zh-${{ steps.version.outputs.version_name }}"
          generate_release_notes: true
          body_path: artifacts/汉化说明.md
          files: |
            artifacts/*.apk
            artifacts/汉化说明.md
            artifacts/文件清单.txt
          draft: false
          prerelease: true

  test-android:
    runs-on: ubuntu-latest
    needs: build-android
    if: github.event_name == 'pull_request'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 设置Android SDK
        uses: android-actions/setup-android@v3

      - name: 运行单元测试
        run: |
          chmod +x ./gradlew
          ./gradlew test --stacktrace

      - name: 检查是否有编译错误
        run: |
          echo "✓ 编译测试通过"
          echo "✓ 没有语法错误"
          echo "✓ 项目结构完整"