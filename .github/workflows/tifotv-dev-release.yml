name: Dev release

# TifoTV's dev environment. Every push to a pull request builds "TifoTV Dev" (package
# tv.own.tifotv.dev, its own data) and publishes it as a release of samolo93190/TifoTV-dev, the
# repository the dev app's in-app updater reads. So the dev app on the emulator updates itself to
# each pull request, keeping its playlist, while the TV only gets what is merged into main.
#
# Needs, once:
#   - a PUBLIC repository samolo93190/TifoTV-dev with at least one commit (a README), and
#   - a secret DEV_RELEASE_TOKEN here: a fine-grained token with Contents read/write on it.
# Without the token the APKs are still built and attached to the run as artifacts.
#
# Signed with the same key as releases (a dev app must keep one signature to update itself).
# Versions are 0.0.<run number>: separate from the TV's 1.x line, and always increasing.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tifotv-dev-release
  cancel-in-progress: false

jobs:
  dev:
    # Pull requests from forks get no secrets, so they can't sign or publish.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 0.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
      TIFO_CHANNEL: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No KEYSTORE_BASE64 secret: a dev build must be release-signed to update itself."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # The same edge key derivation as android.yml, for this build's version name.
      - name: Derive the edge key
        env:
          OWNTV_EDGE_MASTER: ${{ secrets.OWNTV_EDGE_MASTER }}
          OWNTV_EDGE_KEY: ${{ secrets.OWNTV_EDGE_KEY }}
        run: |
          if [ -n "$OWNTV_EDGE_MASTER" ]; then
            KEY=$(printf '%s' "$VERSION_NAME" | openssl dgst -sha256 -hmac "$OWNTV_EDGE_MASTER" -hex | awk '{print $NF}')
            echo "::add-mask::$KEY"
            echo "OWNTV_EDGE_KEY=$KEY" >> "$GITHUB_ENV"
          elif [ -n "$OWNTV_EDGE_KEY" ]; then
            echo "::add-mask::$OWNTV_EDGE_KEY"
            echo "OWNTV_EDGE_KEY=$OWNTV_EDGE_KEY" >> "$GITHUB_ENV"
          fi

      - name: Build TifoTV Dev
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          # The updater picks the asset whose name has "x86_64" on an x86_64 device, the other one elsewhere.
          cp "$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)" "dist/TifoTV-Dev-v$VERSION_NAME.apk"
          cp "$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)" "dist/TifoTV-Dev-x86_64-v$VERSION_NAME.apk"

      - name: Attach the APKs to this run
        uses: actions/upload-artifact@v7
        with:
          name: TifoTV-Dev-v${{ env.VERSION_NAME }}
          path: dist/*.apk
          retention-days: 14

      - name: Publish to TifoTV-dev
        env:
          GH_TOKEN: ${{ secrets.DEV_RELEASE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No DEV_RELEASE_TOKEN secret: built, not published. The APKs are in this run's artifacts."
            exit 0
          fi
          if [ -n "$PR_NUMBER" ]; then
            NOTES="PR #$PR_NUMBER: $PR_TITLE (${GITHUB_SHA::7})"
          else
            NOTES="${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          fi
          gh release create "v$VERSION_NAME" dist/*.apk \
            --repo samolo93190/TifoTV-dev \
            --title "TifoTV Dev $VERSION_NAME" \
            --notes "$NOTES"
